[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cattle-rf"
version = "0.1.0"
description = "Local-first simulated RF livestock tracking MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
  "pyarrow>=17,<30",
  "PyYAML>=6,<7",
  "construct==2.10.70",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
cattle-rf = "riose.products.livestock_tracking.cli:main"
riose = "riose.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cattle_rf", "src/riose"]

[tool.pytest.ini_options]
testpaths = ["tests", "hardware"]
pythonpath = [".", "src"]

